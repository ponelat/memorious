[package]
name = "memorious-desktop"
version = "0.1.0"
description = "Infinite Journal desktop"
edition = "2021"
license.workspace = true

[lib]
name = "memorious_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
memorious-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tokio = { version = "1", features = ["full"] }

# Linux: GTK draws the window's title bar (client-side decoration); the shell
# styles it in the brand at startup. Same version + feature as tauri's own gtk.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
tempfile = "3"
image = "0.25"
