[package]
name = "memorious-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw", "dep:keyring"]

[[bin]]
name = "memorious-desktop"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
data-encoding = "2"
memorious-core = { path = "../../../crates/core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zeroize = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"], optional = true }
keyring = { version = "3", features = ["linux-native"], optional = true }

[dev-dependencies]
image = "0.25"
tempfile = "3"
