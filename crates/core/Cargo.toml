[package]
name = "memorious-core"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[lib]
name = "memorious_core"
path = "src/lib.rs"

[[bin]]
name = "memorious"
path = "src/bin/memorious.rs"

[features]
# Local semantic-search embeddings (ONNX via fastembed). Off by default so
# peers that never run a model (phone, small servers) don't compile or ship it.
embeddings = ["dep:fastembed", "dep:ort"]

[dependencies]
fastembed = { version = "7", optional = true }
# Same version fastembed resolves; named here only to pick the CPU provider.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false }
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
fs2 = "0.4"
image = "0.25.10"
iroh = "1"
iroh-blobs = "0.103"
n0-future = "0.3"
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
iroh = "1"
tempfile = "3"

# RSS guards (tests/blob_fetch.rs, tests/media_rss.rs) read Mach task_info on macOS.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
